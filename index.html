<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KopiEcho Music Player</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0e15; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; padding: 16px; overflow: hidden; }
    .main-layout { display: flex; flex: 1; gap: 20px; height: 75vh; }
    .player-box { flex: 1.4; background: #000; border-radius: 12px; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    .info-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 20px; text-align: center; }
    .status-badge { font-size: 14px; color: #00e676; background: rgba(0, 230, 118, 0.15); padding: 6px 16px; border-radius: 20px; margin-bottom: 16px; }
    .thumb-img { width: 160px; height: 160px; border-radius: 12px; object-fit: cover; margin-bottom: 16px; background-color: #222; }
    .song-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .artist-name { font-size: 16px; color: #aaa; }
    .log-box { height: 20vh; margin-top: 10px; background: #050508; border: 1px solid #222; border-radius: 8px; padding: 8px; font-family: monospace; font-size: 11px; color: #00ff66; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="main-layout">
    <div class="player-box"><div id="player"></div></div>
    <div class="info-box">
      <div id="status" class="status-badge">待機中</div>
      <img id="thumb" class="thumb-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Thumbnail">
      <div id="title" class="song-title">マイミュージック</div>
      <div id="artist" class="artist-name">「曲」または「アルバム」と話しかけてください</div>
    </div>
  </div>
  <div id="log" class="log-box">[System] 初期化を開始します...</div>

  <script>
    let ytPlayer = null;

    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += `<br>> ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // URLからパラメータを取得する関数
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        action: params.get('action'),
        id: params.get('id'),
        title: params.get('title'),
        artist: params.get('artist'),
        thumb: params.get('thumb')
      };
    }

    // YouTube Iframe API 準備完了時のコールバック
    function onYouTubeIframeAPIReady() {
      log('YouTube API 準備完了');
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 1 },
        events: {
          'onReady': () => {
            log('YouTube プレイヤー準備完了');
            checkUrlAndPlay(); // プレイヤーの準備ができたらURLをチェック
          },
          'onError': (e) => log('YouTube 再生エラー: Code ' + e.data)
        }
      });
    }

    // URLを解析して再生を実行
    function checkUrlAndPlay() {
      const data = getUrlParams();
      
      if (!data.id) {
        log('URLに再生データが含まれていません。音声入力を待機します。');
        return;
      }

      log(`データ受信: ${data.action} / ID: ${data.id}`);
      
      // UIを更新
      if (data.title) document.getElementById('title').innerText = decodeURIComponent(data.title);
      if (data.artist) document.getElementById('artist').innerText = decodeURIComponent(data.artist);
      if (data.thumb) document.getElementById('thumb').src = decodeURIComponent(data.thumb);
      
      // 再生処理
      if (data.action === 'PLAY_VIDEO') {
        document.getElementById('status').innerText = '▶ 再生中 (曲)';
        ytPlayer.loadVideoById(data.id);
      } else if (data.action === 'PLAY_PLAYLIST') {
        document.getElementById('status').innerText = '▶ 再生中 (アルバム)';
        ytPlayer.loadPlaylist({ listType: 'playlist', list: data.id });
      }
    }
  </script>
</body>
</html>
