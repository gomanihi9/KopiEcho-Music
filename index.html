<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KopiEcho Music Player - Large UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 960px; height: 480px; overflow: hidden; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: #0d0d12; color: #ffffff; }

        #player-container { position: fixed; top: 0; left: 0; width: 960px; height: 480px; z-index: 1; pointer-events: none; opacity: 0.35; }
        #player-container iframe { width: 960px; height: 540px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: none; }
        .dark-overlay { position: fixed; top: 0; left: 0; width: 960px; height: 480px; background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.88) 100%); z-index: 2; }

        .main-layout { position: relative; z-index: 3; display: flex; flex-direction: column; width: 960px; height: 480px; padding: 20px 40px; justify-content: center; }
        
        .player-content { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; }
        
        /* アルバムアート 2倍近くに大型化 (340px) */
        .album-art-box { width: 340px; height: 340px; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); background: #1a1b26; flex-shrink: 0; }
        .album-art-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .meta-controls { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .status-badge { font-size: 14px; color: #1db954; background: rgba(29, 185, 84, 0.2); padding: 6px 16px; border-radius: 20px; width: fit-content; margin-bottom: 12px; font-weight: 700; }
        
        /* 曲名・アーティスト名の大幅拡大 */
        .song-title { font-size: 40px; font-weight: 800; line-height: 1.15; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .artist-name { font-size: 22px; color: #b3b3b3; font-weight: 600; margin-bottom: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .progress-area { width: 100%; margin-bottom: 24px; }
        .progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.2); border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #ff2a2a; border-radius: 5px; transition: width 0.1s linear; }

        .control-btns { display: flex; align-items: center; gap: 28px; }
        
        /* 再生ボタン・アイコンボタンの大型化 */
        .play-btn { width: 72px; height: 72px; border-radius: 50%; background: #ffffff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.5); transition: transform 0.1s; flex-shrink: 0; }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg { fill: #000; width: 32px; height: 32px; }

        .icon-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.8); cursor: pointer; padding: 14px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s, color 0.2s; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .icon-btn.active { color: #ff2a2a; background: rgba(255, 42, 42, 0.15); border-color: rgba(255, 42, 42, 0.4); }
        .icon-btn svg { width: 28px; height: 28px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- YouTube 背景プレイヤー -->
    <div id="player-container"><div id="yt-player"></div></div>
    <div class="dark-overlay"></div>

    <div class="main-layout">
        <div class="player-content">
            <!-- アルバムアート（大） -->
            <div class="album-art-box">
                <img id="ui-thumb" src="https://placehold.co/400x400/222/fff?text=KopiEcho" alt="Album Art">
            </div>
            <!-- メタデータ＆コントロール（大） -->
            <div class="meta-controls">
                <div id="status" class="status-badge">音声入力を待っています...</div>
                <div id="ui-title" class="song-title">KopiEcho Music</div>
                <div id="ui-artist" class="artist-name">「曲」または「アルバム」と話しかけてください</div>
                
                <div class="progress-area">
                    <div class="progress-bar-bg" onclick="seek(event)">
                        <div id="ui-progress" class="progress-fill"></div>
                    </div>
                </div>

                <div class="control-btns">
                    <button id="repeat-btn" class="icon-btn" onclick="toggleRepeat()" title="リピート">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                    <button class="play-btn" onclick="togglePlay()" aria-label="再生/一時停止">
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let player, isPlaying = false, isRepeat = false;

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                action: params.get('action'),
                id: params.get('id'),
                title: params.get('title'),
                artist: params.get('artist'),
                thumb: params.get('thumb')
            };
        }

        function onYouTubeIframeAPIReady() {
            const data = getUrlParams();
            const initialId = data.id || 'Qxp-TYiShH0';

            player = new YT.Player('yt-player', {
                videoId: initialId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'loop': 1 },
                events: {
                    'onReady': () => {
                        if (data.id) {
                            applyTrackData(data);
                        }
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
            setInterval(updateProgress, 250);
        }

        function applyTrackData(data) {
            if (data.title) document.getElementById('ui-title').innerText = decodeURIComponent(data.title);
            if (data.artist) document.getElementById('ui-artist').innerText = decodeURIComponent(data.artist);
            if (data.thumb) document.getElementById('ui-thumb').src = decodeURIComponent(data.thumb);

            if (data.action === 'PLAY_PLAYLIST') {
                document.getElementById('status').innerText = '▶ 再生中 (アルバム)';
                player.loadPlaylist({ listType: 'playlist', list: data.id });
            } else {
                document.getElementById('status').innerText = '▶ 再生中 (曲)';
                player.loadVideoById(data.id);
            }
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else if (event.data === YT.PlayerState.ENDED) {
                if (isRepeat) player.playVideo();
                else { isPlaying = false; icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            } else {
                isPlaying = false;
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function togglePlay() { if (player && player.getPlayerState) isPlaying ? player.pauseVideo() : player.playVideo(); }
        function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('repeat-btn').classList.toggle('active', isRepeat); }

        function updateProgress() {
            if (player && player.getCurrentTime && player.getDuration) {
                const dur = player.getDuration();
                if (dur > 0) document.getElementById('ui-progress').style.width = ((player.getCurrentTime() / dur) * 100) + '%';
            }
        }

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            if (player && player.getDuration) player.seekTo(((e.clientX - rect.left) / rect.width) * player.getDuration(), true);
        }
    </script>
</body>
</html>
