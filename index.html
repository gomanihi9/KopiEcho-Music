<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Pure Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: #0d0d12; color: #ffffff; }

        #player-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.6; }
        #player-container iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: none; }
        .dark-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.88) 100%); z-index: 2; }

        .main-layout { position: relative; z-index: 3; display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 20px 32px; gap: 16px; }
        .top-bar { display: flex; gap: 12px; width: 100%; max-width: 800px; margin: 0 auto; align-items: center; z-index: 10; }
        
        .alexa-badge { display: flex; align-items: center; gap: 6px; background: rgba(0, 163, 224, 0.2); border: 1px solid rgba(0, 163, 224, 0.4); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #00d8ff; flex-shrink: 0; }
        .alexa-badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #00d8ff; box-shadow: 0 0 8px #00d8ff; }

        .search-section { flex: 1; display: flex; gap: 8px; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px); padding: 6px 14px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 6px 8px; }
        .search-input::placeholder { color: rgba(255,255,255,0.5); }
        .search-btn { background: #ff2a2a; color: #fff; border: none; padding: 8px 22px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s; }
        .search-btn:active { transform: scale(0.95); background: #e02222; }

        .top-icon-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); flex-shrink: 0; transition: background 0.2s; }
        .top-icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .top-icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .results-container { display: none; position: absolute; top: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 740px; max-height: 72vh; overflow-y: auto; background: rgba(18, 19, 26, 0.96); backdrop-filter: blur(24px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.9); z-index: 20; padding: 16px; }
        .results-container::-webkit-scrollbar { width: 6px; }
        .results-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .section-title { font-size: 13px; color: #ff2a2a; text-transform: uppercase; margin: 12px 8px 8px; font-weight: 700; letter-spacing: 0.5px; }
        .result-item { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: background 0.15s, transform 0.1s; }
        .result-item:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
        .result-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #222; flex-shrink: 0; }
        .result-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .result-title { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-sub { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { background: rgba(0, 216, 255, 0.15); color: #00d8ff; border: 1px solid rgba(0, 216, 255, 0.3); font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 8px; margin-left: auto; flex-shrink: 0; }

        .status-msg { text-align: center; color: #aaa; padding: 30px 15px; font-size: 15px; line-height: 1.5; }
        .status-msg.error { color: #ff5555; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #161720; border: 1px solid rgba(255,255,255,0.15); width: 90%; max-width: 520px; border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 16px; }
        .modal-card h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .modal-card input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; }
        .modal-card input:focus { border-color: #ff2a2a; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .btn-save { background: #ff2a2a; color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; border: none; padding: 10px 18px; border-radius: 12px; cursor: pointer; }

        .player-content { flex: 1; display: flex; align-items: center; justify-content: center; gap: 50px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .album-art-box { width: 300px; height: 300px; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); background: #1a1b26; flex-shrink: 0; }
        .album-art-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .meta-controls { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .song-title { font-size: 34px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .artist-name { font-size: 18px; color: #bbb; font-weight: 500; margin-bottom: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .progress-area { width: 100%; margin-bottom: 24px; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #ff2a2a; border-radius: 4px; transition: width 0.1s linear; }

        .control-btns { display: flex; align-items: center; gap: 24px; }
        .play-btn { width: 64px; height: 64px; border-radius: 50%; background: #ffffff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: transform 0.1s; flex-shrink: 0; }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg { fill: #000; width: 28px; height: 28px; }

        .icon-btn { background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: color 0.2s, transform 0.1s; }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.active { color: #ff2a2a; }
        .icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="player-container"><div id="yt-player"></div></div>
    <div class="dark-overlay"></div>

    <div class="main-layout">
        <div class="top-bar">
            <div class="alexa-badge" title="Alexa Voice Mode Ready">
                <div class="alexa-badge-dot"></div>
                <span>Alexa Voice Ready</span>
            </div>
            <div class="search-section">
                <input type="text" id="search-input" class="search-input" placeholder="曲名やアーティスト名を入力..." onkeydown="if(event.key==='Enter') executeSearch()">
                <button class="search-btn" onclick="executeSearch()">検索</button>
            </div>
            <button class="top-icon-btn" title="APIキー設定" onclick="openApiKeyModal()">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>

        <div id="results-list" class="results-container"></div>

        <div class="player-content">
            <div class="album-art-box">
                <img id="ui-thumb" src="https://placehold.co/400x400/222/fff?text=Music+Player" alt="Album Art">
            </div>
            <div class="meta-controls">
                <div id="ui-title" class="song-title">Prema</div>
                <div id="ui-artist" class="artist-name">藤井風</div>
                
                <div class="progress-area">
                    <div class="progress-bar-bg" onclick="seek(event)">
                        <div id="ui-progress" class="progress-fill"></div>
                    </div>
                </div>

                <div class="control-btns">
                    <button id="repeat-btn" class="icon-btn" onclick="toggleRepeat()" title="リピート">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                    <button class="play-btn" onclick="togglePlay()" aria-label="再生/一時停止">
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="icon-btn" onclick="playNextInPlaylist()" title="次の曲">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="api-key-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>🔑 YouTube API Key 設定</h3>
            <p style="font-size:13px; color:#aaa;">YouTube Data API v3のキーを入力してください。</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeApiKeyModal()">キャンセル</button>
                <button class="btn-save" onclick="saveApiKey()">保存する</button>
            </div>
        </div>
    </div>

    <div id="playlist-modal" class="modal-overlay" onclick="closePlaylistModal(event)">
        <div class="modal-card" style="max-width: 620px; max-height: 80vh;" onclick="event.stopPropagation()">
            <div style="display: flex; gap: 18px; align-items: center;">
                <img id="modal-thumb" style="width: 96px; height: 96px; border-radius: 16px; object-fit: cover;" src="" alt="Art">
                <div style="flex:1; min-width:0;">
                    <h3 id="modal-title" style="font-size:18px; line-height:1.3; margin-bottom:4px;"></h3>
                    <p id="modal-author" style="color:#aaa; font-size:13px; margin-bottom:10px;"></p>
                    <div style="display:flex; gap:10px;">
                        <button class="btn-save" style="padding:6px 16px; font-size:13px;" onclick="playCurrentPlaylist(0)">最初から再生</button>
                        <button class="btn-cancel" style="padding:6px 16px; font-size:13px;" onclick="shuffleCurrentPlaylist()">シャッフル</button>
                    </div>
                </div>
            </div>
            <div id="modal-tracks" style="overflow-y: auto; max-height: 45vh; display: flex; flex-direction: column; gap: 6px; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        let player, isPlaying = false, isRepeat = false;
        let activePlaylist = [], currentPlaylistIndex = 0;
        let currentTrackMeta = { videoId: 'Qxp-TYiShH0', title: 'Prema', artist: '藤井風', thumb: 'https://placehold.co/400x400/222/fff?text=Music' };

        if (window.alexa) {
            window.alexa.client.onMessage((message) => {
                handleAlexaVoiceCommand(message);
            });
        }

        function handleAlexaVoiceCommand(msg) {
            if (msg && msg.action === 'SEARCH_PLAY') {
                const query = msg.query;
                const type = msg.type || 'song';
                if (query) {
                    executeSearchAndAutoPlay(query, type);
                }
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: currentTrackMeta.videoId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady() {
            setTimeout(() => { try { player.playVideo(); } catch(e) {} }, 10);
            setInterval(updateProgress, 250);
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else if (event.data === YT.PlayerState.ENDED) {
                if (isRepeat) { player.playVideo(); }
                else if (activePlaylist.length > 0 && currentPlaylistIndex + 1 < activePlaylist.length) { playNextInPlaylist(); }
                else { isPlaying = false; icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            } else {
                isPlaying = false;
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function togglePlay() { if (player && player.getPlayerState) isPlaying ? player.pauseVideo() : player.playVideo(); }
        function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('repeat-btn').classList.toggle('active', isRepeat); }

        function updateProgress() {
            if (player && player.getCurrentTime && player.getDuration) {
                const dur = player.getDuration();
                if (dur > 0) document.getElementById('ui-progress').style.width = ((player.getCurrentTime() / dur) * 100) + '%';
            }
        }

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            if (player && player.getDuration) player.seekTo(((e.clientX - rect.left) / rect.width) * player.getDuration(), true);
        }

        function getApiKey() { return localStorage.getItem('yt_api_key') || ''; }
        function openApiKeyModal() { document.getElementById('api-key-input').value = getApiKey(); document.getElementById('api-key-modal').classList.add('active'); }
        function closeApiKeyModal() { document.getElementById('api-key-modal').classList.remove('active'); }
        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) { localStorage.setItem('yt_api_key', key); closeApiKeyModal(); }
        }

        /* 🎯 公式・オーディオ優先のフィルタリングロジック */
        function filterAndSortTracks(items) {
            const forbiddenRegex = /(\bvideo\b|\bmv\b|music video|official video|lyric video)/i;

            const validItems = items.filter(item => {
                const title = (item.snippet?.title || '').toLowerCase();
                return !forbiddenRegex.test(title);
            });

            validItems.sort((a, b) => {
                const aDesc = a.snippet?.description || '';
                const aChan = a.snippet?.channelTitle || '';
                const bDesc = b.snippet?.description || '';
                const bChan = b.snippet?.channelTitle || '';

                const aIsOfficial = aDesc.includes('Provided to YouTube') || aChan.includes('- Topic');
                const bIsOfficial = bDesc.includes('Provided to YouTube') || bChan.includes('- Topic');

                if (aIsOfficial && !bIsOfficial) return -1;
                if (!aIsOfficial && bIsOfficial) return 1;
                return 0;
            });

            return validItems;
        }

        async function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            const resultsList = document.getElementById('results-list');
            if (!query) return;

            const apiKey = getApiKey();
            if (!apiKey) { openApiKeyModal(); return; }

            resultsList.style.display = 'block';
            resultsList.innerHTML = `<div class="status-msg">🔍 検索中...</div>`;

            try {
                const vUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=25&q=${encodeURIComponent(query)}&key=${apiKey}`;
                const pUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=playlist&maxResults=6&q=${encodeURIComponent(query + " アルバム")}&key=${apiKey}`;

                let [vRes, pRes] = await Promise.all([fetch(vUrl), fetch(pUrl)]);
                let vData = await vRes.json();
                let pData = await pRes.json();

                let sortedVideos = filterAndSortTracks(vData.items || []);
                renderSearchResults(sortedVideos, pData.items || []);
            } catch (err) {
                resultsList.innerHTML = `<div class="status-msg error">通信エラー: ${escapeHtml(err.message)}</div>`;
            }
        }

        async function executeSearchAndAutoPlay(query, type = 'song') {
            const apiKey = getApiKey();
            if (!apiKey) return;

            try {
                if (type === 'album') {
                    const pUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=playlist&maxResults=3&q=${encodeURIComponent(query + " アルバム")}&key=${apiKey}`;
                    const res = await fetch(pUrl);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        const firstPl = data.items[0];
                        await openPlaylistModal(firstPl.id.playlistId, firstPl.snippet.title, firstPl.snippet.channelTitle, firstPl.snippet.thumbnails?.high?.url);
                        playCurrentPlaylist(0);
                    }
                } else {
                    const vUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=10&q=${encodeURIComponent(query)}&key=${apiKey}`;
                    const res = await fetch(vUrl);
                    const data = await res.json();
                    let items = filterAndSortTracks(data.items || []);
                    if (items.length > 0) {
                        const item = items[0];
                        const snippet = item.snippet;
                        const title = snippet.title.replace(/ - Topic$/i, '');
                        const artist = snippet.channelTitle.replace(/ - Topic$/i, '');
                        const thumb = snippet.thumbnails?.high?.url;
                        selectSingleSong(item.id.videoId, title, artist, thumb);
                    }
                }
            } catch(e) {
                console.error("AutoPlay error", e);
            }
        }

        function renderSearchResults(videos, playlists) {
            const list = document.getElementById('results-list');
            list.innerHTML = '';
            if (videos.length === 0 && playlists.length === 0) {
                list.innerHTML = `<div class="status-msg">該当する楽曲が見つかりませんでした。キーワードを変更してください。</div>`;
                return;
            }

            if (videos.length > 0) {
                list.appendChild(createSectionHeader('🎵 楽曲一覧 (公式優先)'));
                videos.forEach(item => {
                    const snippet = item.snippet;
                    const title = snippet.title.replace(/ - Topic$/i, '');
                    const artist = snippet.channelTitle.replace(/ - Topic$/i, '');
                    const thumb = snippet.thumbnails?.high?.url;
                    const isOfficial = (snippet.description || '').includes('Provided to YouTube') || artist.includes('Topic');
                    const el = createResultItem(thumb, title, artist, () => selectSingleSong(item.id.videoId, title, artist, thumb), isOfficial ? 'Official Audio' : 'Video');
                    list.appendChild(el);
                });
            }

            if (playlists.length > 0) {
                list.appendChild(createSectionHeader('💿 アルバム / プレイリスト'));
                playlists.forEach(item => {
                    const snippet = item.snippet;
                    const thumb = snippet.thumbnails?.high?.url;
                    const el = createResultItem(thumb, snippet.title, snippet.channelTitle, () => openPlaylistModal(item.id.playlistId, snippet.title, snippet.channelTitle, thumb), 'ALBUM');
                    list.appendChild(el);
                });
            }
        }

        function createSectionHeader(title) { const div = document.createElement('div'); div.className = 'section-title'; div.innerText = title; return div; }
        function createResultItem(thumb, title, artist, onClick, badge = null) {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <img src="${thumb || 'https://placehold.co/100x100/222/fff?text=No+Img'}" class="result-thumb" onerror="this.src='https://placehold.co/100x100/222/fff?text=No+Img'">
                <div class="result-info"><div class="result-title">${escapeHtml(title)}</div><div class="result-sub">${escapeHtml(artist)}</div></div>
                ${badge ? `<span class="badge">${badge}</span>` : ''}
            `;
            div.onclick = onClick;
            return div;
        }

        function selectSingleSong(videoId, title, artist, thumbUrl) {
            document.getElementById('results-list').style.display = 'none';
            activePlaylist = [];
            loadAndPlay(videoId, title, artist, thumbUrl);
        }

        function loadAndPlay(videoId, title, artist, thumbUrl) {
            currentTrackMeta = { videoId, title, artist, thumb: thumbUrl };
            document.getElementById('ui-title').innerText = title;
            document.getElementById('ui-artist').innerText = artist;
            document.getElementById('ui-thumb').src = thumbUrl;
            if (player && player.loadVideoById) player.loadVideoById(videoId);
        }

        async function openPlaylistModal(playlistId, title, author, thumbUrl) {
            document.getElementById('results-list').style.display = 'none';
            const apiKey = getApiKey();
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-author').innerText = author;
            document.getElementById('modal-thumb').src = thumbUrl;
            document.getElementById('modal-tracks').innerHTML = `<div class="status-msg">トラックリストを取得中...</div>`;
            document.getElementById('playlist-modal').classList.add('active');

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${apiKey}`);
                const data = await res.json();
                activePlaylist = (data.items || []).map(item => ({
                    videoId: item.snippet.resourceId.videoId,
                    title: item.snippet.title.replace(/ - Topic$/i, ''),
                    artist: item.snippet.videoOwnerChannelTitle || author,
                    thumb: item.snippet.thumbnails?.high?.url || thumbUrl
                })).filter(t => t.title !== 'Private video' && t.title !== 'Deleted video');
                renderModalTracks();
            } catch (err) {
                document.getElementById('modal-tracks').innerHTML = `<div class="status-msg error">取得失敗</div>`;
            }
        }

        function renderModalTracks() {
            const container = document.getElementById('modal-tracks');
            container.innerHTML = '';
            activePlaylist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div style="width:24px; color:#666; font-weight:bold; font-size:13px; text-align:center;">${idx + 1}</div>
                    <img src="${track.thumb}" class="result-thumb" style="width:40px; height:40px;">
                    <div class="result-info"><div class="result-title" style="font-size:14px;">${escapeHtml(track.title)}</div></div>
                `;
                item.onclick = () => { closePlaylistModal(); playCurrentPlaylist(idx); };
                container.appendChild(item);
            });
        }

        function playCurrentPlaylist(index = 0) {
            if (activePlaylist.length === 0) return;
            currentPlaylistIndex = index;
            const t = activePlaylist[currentPlaylistIndex];
            loadAndPlay(t.videoId, t.title, t.artist, t.thumb);
            closePlaylistModal();
        }

        function shuffleCurrentPlaylist() {
            if (activePlaylist.length === 0) return;
            for (let i = activePlaylist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activePlaylist[i], activePlaylist[j]] = [activePlaylist[j], activePlaylist[i]];
            }
            playCurrentPlaylist(0);
        }

        function playNextInPlaylist() {
            if (activePlaylist.length > 0 && currentPlaylistIndex + 1 < activePlaylist.length) {
                currentPlaylistIndex++;
                playCurrentPlaylist(currentPlaylistIndex);
            }
        }

        function closePlaylistModal(e) { document.getElementById('playlist-modal').classList.remove('active'); }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
    </script>
</body>
</html>
