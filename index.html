<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Show Pure Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: #0d0d12; color: #ffffff; }

        #player-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; opacity: 0.6; }
        #player-container iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: none; }
        .dark-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.88) 100%); z-index: 2; }

        .main-layout { position: relative; z-index: 3; display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 24px 40px; gap: 20px; }
        .top-bar { display: flex; gap: 16px; width: 100%; max-width: 800px; margin: 0 auto; align-items: center; z-index: 10; }
        
        .alexa-badge { display: flex; align-items: center; gap: 8px; background: rgba(0, 163, 224, 0.2); border: 1px solid rgba(0, 163, 224, 0.4); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #00d8ff; flex-shrink: 0; }
        .alexa-badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #00d8ff; box-shadow: 0 0 8px #00d8ff; }
        .alexa-badge.listening { background: rgba(255, 42, 42, 0.25); border-color: rgba(255, 42, 42, 0.6); color: #ff5555; }
        .alexa-badge.listening .alexa-badge-dot { background: #ff2a2a; box-shadow: 0 0 10px #ff2a2a; animation: pulse 1s infinite alternate; }

        @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        .voice-status-banner { display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 163, 224, 0.9); backdrop-filter: blur(12px); color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 16px; font-weight: 600; box-shadow: 0 8px 25px rgba(0,0,0,0.5); z-index: 25; text-align: center; border: 1px solid rgba(255,255,255,0.3); }

        .player-content { flex: 1; display: flex; align-items: center; justify-content: center; gap: 60px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .album-art-box { width: 320px; height: 320px; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7); background: #1a1b26; flex-shrink: 0; }
        .album-art-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .meta-controls { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .song-title { font-size: 36px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .artist-name { font-size: 20px; color: #bbb; font-weight: 500; margin-bottom: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .progress-area { width: 100%; margin-bottom: 28px; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #ff2a2a; border-radius: 4px; transition: width 0.1s linear; }

        .control-btns { display: flex; align-items: center; gap: 28px; }
        .play-btn { width: 68px; height: 68px; border-radius: 50%; background: #ffffff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: transform 0.1s; flex-shrink: 0; }
        .play-btn:active { transform: scale(0.92); }
        .play-btn svg { fill: #000; width: 30px; height: 30px; }

        .icon-btn { background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; padding: 10px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: color 0.2s, transform 0.1s; }
        .icon-btn.active { color: #ff2a2a; }
        .icon-btn svg { width: 28px; height: 28px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="player-container"><div id="yt-player"></div></div>
    <div class="dark-overlay"></div>

    <div class="main-layout">
        <div class="top-bar">
            <div id="alexa-status-badge" class="alexa-badge" title="Alexa Voice Mode Ready">
                <div class="alexa-badge-dot"></div>
                <span id="alexa-status-text">Alexa Voice Ready</span>
            </div>
        </div>

        <div id="voice-banner" class="voice-status-banner"></div>

        <div class="player-content">
            <div class="album-art-box">
                <img id="ui-thumb" src="https://placehold.co/400x400/222/fff?text=Music+Player" alt="Album Art">
            </div>
            <div class="meta-controls">
                <div id="ui-title" class="song-title">マイミュージック</div>
                <div id="ui-artist" class="artist-name">Alexa 連携プレイヤー</div>
                
                <div class="progress-area">
                    <div class="progress-bar-bg" onclick="seek(event)">
                        <div id="ui-progress" class="progress-fill"></div>
                    </div>
                </div>

                <div class="control-btns">
                    <button id="repeat-btn" class="icon-btn" onclick="toggleRepeat()" title="リピート">
                        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                    <button class="play-btn" onclick="togglePlay()" aria-label="再生/一時停止">
                        <svg id="play-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="icon-btn" onclick="playNextInPlaylist()" title="次の曲">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let player, isPlaying = false, isRepeat = false;
        let activePlaylist = [], currentPlaylistIndex = 0;
        let currentTrackMeta = { videoId: 'Qxp-TYiShH0', title: 'マイミュージック', artist: 'Alexa 連携プレイヤー', thumb: 'https://placehold.co/400x400/222/fff?text=Music' };

        // Alexa Web API Client 受信ハンドラ
        if (window.alexa) {
            window.alexa.client.onMessage((message) => {
                handleAlexaVoiceCommand(message);
            });
        }

        function setVoiceStatusBanner(text, isListening = false, duration = 5000) {
            const banner = document.getElementById('voice-banner');
            const badge = document.getElementById('alexa-status-badge');
            const badgeText = document.getElementById('alexa-status-text');

            if (text) {
                banner.innerText = text;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }

            if (isListening) {
                badge.classList.add('listening');
                badgeText.innerText = 'Alexa 聞き取り中...';
            } else {
                badge.classList.remove('listening');
                badgeText.innerText = 'Alexa Voice Ready';
            }

            if (duration > 0 && text) {
                setTimeout(() => { banner.style.display = 'none'; }, duration);
            }
        }

        function handleAlexaVoiceCommand(msg) {
            if (!msg) return;

            if (msg.action === 'VOICE_PROMPT') {
                setVoiceStatusBanner(msg.promptText, true, 8000);
            } else if (msg.action === 'PLAY_VIDEO') {
                setVoiceStatusBanner(`🎤 楽曲「${msg.title}」を再生中`, false, 5000);
                loadAndPlay(msg.videoId, msg.title, msg.artist, msg.thumb);
            } else if (msg.action === 'PLAY_PLAYLIST') {
                setVoiceStatusBanner(`🎤 アルバム「${msg.title}」を読み込み中`, false, 5000);
                loadPlaylistAndPlay(msg.playlistId, msg.title, msg.artist, msg.thumb);
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: currentTrackMeta.videoId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady() {
            setInterval(updateProgress, 250);
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else if (event.data === YT.PlayerState.ENDED) {
                if (isRepeat) { player.playVideo(); }
                else if (activePlaylist.length > 0 && currentPlaylistIndex + 1 < activePlaylist.length) { playNextInPlaylist(); }
                else { isPlaying = false; icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
            } else {
                isPlaying = false;
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function togglePlay() { if (player && player.getPlayerState) isPlaying ? player.pauseVideo() : player.playVideo(); }
        function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('repeat-btn').classList.toggle('active', isRepeat); }

        function updateProgress() {
            if (player && player.getCurrentTime && player.getDuration) {
                const dur = player.getDuration();
                if (dur > 0) document.getElementById('ui-progress').style.width = ((player.getCurrentTime() / dur) * 100) + '%';
            }
        }

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            if (player && player.getDuration) player.seekTo(((e.clientX - rect.left) / rect.width) * player.getDuration(), true);
        }

        function loadAndPlay(videoId, title, artist, thumbUrl) {
            currentTrackMeta = { videoId, title, artist, thumb: thumbUrl };
            document.getElementById('ui-title').innerText = title;
            document.getElementById('ui-artist').innerText = artist;
            document.getElementById('ui-thumb').src = thumbUrl;
            activePlaylist = []; // 単曲再生時はプレイリストクリア
            if (player && player.loadVideoById) player.loadVideoById(videoId);
        }

        async function loadPlaylistAndPlay(playlistId, title, author, thumbUrl) {
            // Note: プレイリスト内の曲取得はLambda側から行うことも可能ですが、ここではシンプルにプレイヤーが処理します
            // もしくはLambda側からvideoIdを渡すように拡張できます。
        }

        function playNextInPlaylist() {
            if (activePlaylist.length > 0 && currentPlaylistIndex + 1 < activePlaylist.length) {
                currentPlaylistIndex++;
                const t = activePlaylist[currentPlaylistIndex];
                loadAndPlay(t.videoId, t.title, t.artist, t.thumb);
            }
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
    </script>
</body>
</html>
